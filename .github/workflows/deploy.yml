name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & push support-panel-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: la5er/support-panel-frontend:latest
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=/api/v1

      - name: Build & push support-panel-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: la5er/support-panel-backend:latest
          platforms: linux/amd64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST2 }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY2 }}
          port: ${{ secrets.SSH_PORT2 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            cd /opt/rag-stack
            
            # Use override file for support-panel services
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.support-panel.yml"
            
            echo "Pulling images..."
            timeout 300 docker compose $COMPOSE_FILES pull support-panel-frontend support-panel-backend || echo "Pull failed or timeout, continuing..."
            
            echo "Starting services..."
            docker compose $COMPOSE_FILES up -d support-panel-frontend support-panel-backend support-panel-db
            
            echo "Waiting for services to start..."
            sleep 10
            
            # Run database migrations
            echo "Running migrations..."
            docker compose $COMPOSE_FILES exec -T support-panel-backend uv run alembic upgrade head || echo "Migration failed or already up to date"
            
            # Status check
            echo "Service status:"
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" | grep -E "(support-panel)" || true
            
            echo "Deployment finished successfully."
