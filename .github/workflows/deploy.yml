name: Validate deployment configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Coolify Compose
        run: docker compose -f docker-compose.coolify.yml config --quiet
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - name: Verify production runtime and outbound TLS policy
        working-directory: backend
        run: |
          uv sync --frozen --no-dev --python 3.12
          .venv/bin/python -m unittest discover -s tests -v

# Production deployment belongs only to the installed Coolify GitHub App.
